<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería · Asador La Estancia</title>
  <meta name="description" content="Imágenes de platos, brasa y sala de Asador La Estancia en Alicante.">
  <link rel="icon" href="assets/images/brand/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="galeria">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="site-header" data-header></header>

  <main id="contenido">
    <section class="page-hero">
      <img class="hero-bg" src="assets/images/gallery/meat12.png" alt="Parrillada de La Estancia">
      <div class="page-hero-content">
        <h1 data-copy="h1">Los platos</h1>
        <p data-copy="lead">Brasa, mar, verdura y mesa. La Estancia, en imágenes.</p>
      </div>
    </section>

    <section class="gallery-page">
      <div class="container">
        <div class="menu-tools">
          <div class="menu-tabs" data-tabs-scroller>
            <button type="button" class="menu-tabs-arrow is-start" data-tabs-prev aria-label="Secciones anteriores">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="tabs" data-tabs></div>
            <button type="button" class="menu-tabs-arrow is-end" data-tabs-next aria-label="Más secciones">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5 16 12l-6.5 6.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>
        <div data-gallery></div>
      </div>
    </section>
  </main>

  <div class="gallery-lite" data-gallery-lite hidden>
    <button type="button" class="gallery-lite-close" data-gallery-close aria-label="Cerrar"></button>
    <button type="button" class="gallery-lite-nav is-prev" data-gallery-prev aria-label="Anterior"></button>
    <figure class="gallery-lite-stage">
      <img data-gallery-image alt="">
      <figcaption data-gallery-caption></figcaption>
    </figure>
    <button type="button" class="gallery-lite-nav is-next" data-gallery-next aria-label="Siguiente"></button>
  </div>

  <footer class="site-footer" data-footer></footer>
  <script src="js/gallery.js"></script>
  <script src="js/site.js"></script>
</body>
</html>
