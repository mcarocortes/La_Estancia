<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galería · Asador La Estancia</title>
  <meta name="description" content="Imágenes de platos, brasa y sala de Asador La Estancia en Alicante.">
  <link rel="icon" href="assets/images/brand/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="galeria">
  <a class="skip" href="#contenido">Saltar al contenido</a>
  <header class="site-header" data-header></header>

  <main id="contenido">
    <section class="page-hero">
      <img class="hero-bg" src="assets/images/gallery/ribeye.jpg" alt="Corte a la parrilla">
      <div class="page-hero-content">
        <h1 data-copy="h1">Los platos</h1>
        <p data-copy="lead">Brasa, mar y mesa. Una galería para ver lo que llega al plato.</p>
      </div>
    </section>

    <section class="gallery-grid">
      <figure class="wide"><img src="assets/images/tomahawk.jpg" alt="Tomahawk"></figure>
      <figure><img src="assets/images/gallery/prawns.jpg" alt="Gambas"></figure>
      <figure><img src="assets/images/gallery/plated.jpg" alt="Plato de la casa"></figure>
      <figure><img src="assets/images/feast.jpg" alt="Parrillada"></figure>
      <figure class="wide"><img src="assets/images/gallery/seafood.jpg" alt="Parrillada de mariscos"></figure>
      <figure><img src="assets/images/gallery/ribs.jpg" alt="Costillas"></figure>
      <figure><img src="assets/images/gallery/cuttlefish.jpg" alt="Sepia"></figure>
      <figure><img src="assets/images/gallery/chimichurri.jpg" alt="Chimichurri"></figure>
      <figure class="wide"><img src="assets/images/gallery/dining.jpg" alt="Sala de La Estancia"></figure>
      <figure><img src="assets/images/panqueques.jpg" alt="Panqueque"></figure>
      <figure><img src="assets/images/gallery/wine.jpg" alt="Vino"></figure>
      <figure><img src="assets/images/gallery/ember.jpg" alt="Brasa"></figure>
      <figure><img src="assets/images/interior.jpg" alt="Interior"></figure>
    </section>
  </main>

  <footer class="site-footer" data-footer></footer>
  <script src="js/site.js"></script>
</body>
</html>
